<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<title>¿Podrás adivinarlo? ❓</title>
<style>
.preg { margin-bottom: 18px; }
.preg h2 { margin: 0 0 12px; font: 700 18px/1.35 var(--t-cuerpo); color: var(--ink); }
.preg h2 em { font-style: normal; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--rosa-s); color: var(--rosa-f); margin-right: 8px; font-size: 15px; }
.ops { display: flex; flex-direction: column; gap: 9px; }
.op { appearance: none; text-align: left; font: 600 15.5px/1.4 var(--t-cuerpo); color: var(--ink); background: #fff; border: 2px solid #d8e8fb; border-radius: 16px; padding: 12px 14px; cursor: pointer; transition: transform .12s ease, background .2s; -webkit-tap-highlight-color: transparent; }
.op:active { transform: scale(.98); }
.op.bien { background: #e4f8ef; border-color: #4cc38a; color: #1f6b46; font-weight: 700; }
.op.mal { background: #ffe9ee; border-color: #f48fb1; color: #a8324f; }
.res { margin: 10px 2px 0; font: 700 22px/1.2 var(--t-mano); min-height: 26px; }
.final { text-align: center; }
.final b { display: block; font: 700 64px/1 var(--t-titulo); color: var(--rosa-f); }
.final p { margin: 6px 0 0; font: 700 26px/1.2 var(--t-mano); color: var(--azul-f); }
#confeti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<canvas id="confeti" aria-hidden="true"></canvas>
<main class="pagina">
  <a href="index.html" class="volver">⬅ Regresar al menú</a>
  <header class="cabeza aparece"><span class="mini">Jueguito</span><h1>¿Podrás adivinarlo? ❓</h1><p>¡Pon a prueba tu memoria, mi amor!</p></header>
  <section class="tarjeta aparece" id="juego"></section>
  <section class="tarjeta final aparece" id="final" hidden style="margin-top:16px"><b id="puntos">3/3</b><p id="frase"></p></section>
  <div class="pie"><a href="index.html" class="btn azul">⬅ Regresar al menú</a></div>
</main>
<script src="fondo.js"></script>
<script>
  const P = [
    { q: '¿Cómo fue que nos conocimos?', o: ['En la escuela', 'En la isla de Free Fire', 'Por casualidad en la calle'], b: 1 },
    { q: '¿Qué día nos hicimos novios oficialmente?', o: ['14 de julio de 2026', '14 de junio de 2026', '20 de agosto de 2026'], b: 1 },
    { q: '¿Quién ama más a quién?', o: ['Mi novio me ama más', 'Lalito me ama más', 'Mi novio Lalito, en esta vida y en todas las vidas, porque siempre me buscará, porque yo soy su camino y siempre seré su camino. ✨'], b: 2 },
  ];
  const J = document.getElementById('juego'); let resp = 0, bien = 0;
  P.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'preg';
    d.innerHTML = `<h2><em>${i + 1}</em>${p.q}</h2><div class="ops">${p.o.map((o, k) => `<button class="op" type="button" data-k="${k}">${o}</button>`).join('')}</div><p class="res"></p>`;
    d.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => {
      const k = +b.dataset.k, ok = k === p.b; d.querySelectorAll('.op').forEach(x => x.disabled = true);
      const res = d.querySelector('.res');
      if (ok) { b.classList.add('bien'); res.style.color = '#2f8a5c'; res.textContent = '¡Correcto! 💞 ¡Eres la que más me conoce!'; bien++; confeti(); }
      else { b.classList.add('mal'); d.querySelectorAll('.op')[p.b].classList.add('bien'); res.style.color = '#c4436a'; res.textContent = 'Mmm casi, ¡intenta recordar bien! 😉'; }
      if (++resp === P.length) setTimeout(() => { const f = document.getElementById('final'); f.hidden = false; document.getElementById('puntos').textContent = bien + '/' + P.length;
        document.getElementById('frase').textContent = bien === P.length ? '¡Me conoces perfecto, mi princesa! 💞' : '¡Igual te amo con todo mi corazón! 💞'; f.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (bien === P.length) confeti(160); }, 700);
    }));
    J.appendChild(d);
  });
  // Confeti al acertar
  const cv = document.getElementById('confeti'), x = cv.getContext('2d'); let piezas = [], corriendo = false;
  function confeti(n = 70) { const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; x.setTransform(r, 0, 0, r, 0, 0);
    for (let i = 0; i < n; i++) piezas.push({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 12, vy: -6 - Math.random() * 8, a: Math.random() * 6, c: ['#f48fb1', '#8cc0f2', '#f5c86b', '#9be0c4', '#c9a8ff'][i % 5], v: 1 });
    if (!corriendo) { corriendo = true; requestAnimationFrame(paso); } }
  function paso() { x.clearRect(0, 0, innerWidth, innerHeight); piezas = piezas.filter(p => p.v > 0);
    for (const p of piezas) { p.x += p.vx; p.y += p.vy; p.vy += .3; p.vx *= .99; p.a += .2; p.v -= .008; x.save(); x.globalAlpha = Math.max(0, p.v); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-4, -6, 8, 12); x.restore(); }
    if (piezas.length) requestAnimationFrame(paso); else { corriendo = false; x.clearRect(0, 0, innerWidth, innerHeight); } }
</script>
</body>
</html>
