<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<title>Nuestras canciones 🎶</title>
<style>
.nota-intro { text-align: center; margin: -6px auto 22px; max-width: 34ch; color: var(--ink-s); }
.cancion { display: grid; grid-template-columns: 64px 1fr 52px; align-items: center; gap: 14px; background: rgba(255,255,255,.92); border-radius: 20px; padding: 12px 14px; margin-bottom: 14px; box-shadow: 0 0 0 1.5px var(--c2), 0 10px 22px rgba(74,61,85,.1); }
.disco { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, var(--c) 0 13px, #2b2338 14px 15px, #3a3048 16px 22px, #2b2338 23px 24px, #3a3048 25px 31px, #2b2338 32px); box-shadow: 0 4px 10px rgba(0,0,0,.25); position: relative; }
.disco::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; }
.sonando .disco { animation: gira 2.4s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.cancion b { display: block; font: 700 16.5px/1.25 var(--t-cuerpo); }
.cancion small { color: var(--ink-s); font-size: 13.5px; }
.barra { height: 6px; border-radius: 3px; background: #f1e7ee; margin-top: 8px; overflow: hidden; cursor: pointer; }
.barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c), var(--rosa)); }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 20px; color: #fff; background: linear-gradient(180deg, #ff9fbf, var(--rosa-f)); box-shadow: 0 6px 14px rgba(224,86,127,.35); -webkit-tap-highlight-color: transparent; }
.play:active { transform: scale(.94); }
.spotify { display: flex; justify-content: center; margin-top: 22px; }
.spotify .btn { background: linear-gradient(180deg, #2ee27a, #1aa94e); box-shadow: 0 6px 0 #138a3e, 0 12px 24px rgba(29,185,84,.3); }
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<main class="pagina">
  <a href="index.html" class="volver">⬅ Regresar al menú</a>
  <header class="cabeza aparece"><span class="mini">Playlist</span><h1>Canciones que me recuerdan a ti 🎶</h1></header>
  <p class="nota-intro aparece">Estas canciones ya están en la playlist que te hice hace tiempo, pero quería ponerlas aquí para que las escuches ahora mismo porque me recuerdan muchísimo a ti 💞</p>
  <section id="lista"></section>
  <div class="spotify"><a class="btn" target="_blank" rel="noopener" href="https://open.spotify.com/playlist/6KEaCrIh5V5XhcSS13jjKU?si=8jOvTB24TCelL2IYArS4Tw&amp;utm_source=whatsapp&amp;pi=0BoqJC8ZRyO92&amp;pt=cae911a28832a899ada2338634c22b58">🎧 Escuchar la playlist completa</a></div>
  <div class="pie"><a href="index.html" class="btn azul">⬅ Regresar al menú</a></div>
</main>
<script src="fondo.js"></script>
<script>
  const CANCIONES = [
    { t: 'Cinderella', a: 'Mac Miller', f: 'cinderella.mp3', c: '#f48fb1', c2: '#ffe3ec' },
    { t: 'Congratulations', a: 'Mac Miller', f: 'congratulations.mp3', c: '#8cc0f2', c2: '#e3f0ff' },
    { t: 'Neo Roneo', a: 'Latin Mafia', f: 'neoroneo.mp3', c: '#c9a8ff', c2: '#f1e9ff' },
    { t: 'Mi sorpresa fuiste tú', a: 'Calibre 50', f: 'sorpresa.mp3', c: '#f5c86b', c2: '#fff4dc' },
  ];
  const L = document.getElementById('lista'); let actual = null;
  CANCIONES.forEach((c, i) => {
    const el = document.createElement('div'); el.className = 'cancion aparece'; el.style.cssText = `--c:${c.c};--c2:${c.c2};animation-delay:${.1 + i * .08}s`;
    el.innerHTML = `<div class="disco"></div><div><b>${c.t}</b><small>${c.a}</small><div class="barra"><i></i></div></div><button class="play" type="button" aria-label="Reproducir ${c.t}">▶</button>`;
    const au = new Audio(c.f); au.preload = 'none'; const btn = el.querySelector('.play'), barra = el.querySelector('.barra');
    btn.addEventListener('click', () => { if (!au.paused) { au.pause(); return; } if (actual && actual !== au) actual.pause(); actual = au; au.play(); });
    au.addEventListener('play', () => { el.classList.add('sonando'); btn.textContent = '❚❚'; });
    au.addEventListener('pause', () => { el.classList.remove('sonando'); btn.textContent = '▶'; });
    au.addEventListener('ended', () => { el.classList.remove('sonando'); btn.textContent = '▶'; });
    au.addEventListener('timeupdate', () => { el.querySelector('.barra i').style.width = (au.currentTime / (au.duration || 1) * 100) + '%'; });
    barra.addEventListener('click', e => { if (!au.duration) return; const r = barra.getBoundingClientRect(); au.currentTime = (e.clientX - r.left) / r.width * au.duration; });
    L.appendChild(el);
  });
</script>
</body>
</html>
