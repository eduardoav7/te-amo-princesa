<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cómo nos conocimos 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
:root { --ink: #22264a; --rosa: #ff8fab; --azul: #7fb2ec; --oro: #ffd25e; --noche: #141838; --font-hand: 'Caveat', 'Segoe Print', cursive; --font-body: 'Nunito', system-ui, sans-serif; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { min-height: 100vh; min-height: 100dvh; background: var(--noche) radial-gradient(120% 70% at 50% 0%, #2c3270 0%, var(--noche) 70%); color: #fff; font: 600 16px/1.5 var(--font-body); display: flex; flex-direction: column; align-items: center; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
.arriba { width: min(420px, 100%); display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.volver { color: #fff; text-decoration: none; font: 800 14px/1 var(--font-body); background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .35); border-radius: 999px; padding: 9px 14px; }
.titulo { margin: 0; font: 700 26px/1 var(--font-hand); color: #ffe8a8; }
.escenario { position: relative; width: min(420px, 100%); aspect-ratio: 360 / 560; border-radius: 26px; overflow: hidden; border: 3px solid #ffe8a8; box-shadow: 0 0 0 6px rgba(255, 232, 168, .15), 0 24px 60px rgba(0, 0, 0, .5); background: #1b2050; }
.escenario svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.leyenda { width: min(420px, 100%); min-height: 3.2em; margin: 14px 0 0; text-align: center; font: 700 28px/1.12 var(--font-hand); color: #ffe8a8; text-wrap: balance; text-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
.leyenda.cambia { animation: entra .9s ease both; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.barra { width: min(420px, 100%); height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .15); margin-top: 12px; overflow: hidden; }
.barra span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rosa), var(--oro), var(--azul)); }
.ctrl { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
.btn { appearance: none; border: 2.5px solid var(--ink); border-radius: 999px; padding: 12px 20px; font: 800 16px/1 var(--font-body); color: var(--ink); background: var(--oro); box-shadow: 0 4px 0 #0b0d22; cursor: pointer; }
.btn.claro { background: #fff; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b0d22; }
.btn:focus-visible { outline: 3px dashed var(--oro); outline-offset: 3px; }
/* Portada sobre el escenario */
.portada { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: radial-gradient(90% 70% at 50% 35%, rgba(44, 50, 112, .65), rgba(20, 24, 56, .92)); z-index: 2; }
.portada h1 { margin: 0; font: 700 46px/.95 var(--font-hand); color: #fff; }
.portada h1 span { display: block; font-size: .62em; color: var(--rosa); margin-top: 6px; }
.portada p { margin: 0; color: #c9cdf2; font-size: 14px; }
.play { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--ink); background: var(--oro); box-shadow: 0 5px 0 #0b0d22, 0 0 0 10px rgba(255, 210, 94, .18); font-size: 32px; color: var(--ink); cursor: pointer; animation: late 1.8s ease-in-out infinite; }
@keyframes late { 50% { transform: scale(1.07); } }
.portada[hidden] { display: none; }

/* Escenas */
.esc { opacity: 0; transition: opacity 1.2s ease; }
.esc.on { opacity: 1; }
.titila { animation: titila 2.4s ease-in-out infinite; }
@keyframes titila { 50% { opacity: .25; } }
.fugaz { opacity: 0; }
.on .fugaz { animation: fugaz 2.2s ease-in 1.5s 2 both; }
@keyframes fugaz { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-220px, 120px); } }
.aparece { opacity: 0; }
.on .aparece { animation: aparece .9s ease both; animation-delay: var(--d, 0s); }
@keyframes aparece { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.fb { transform-box: fill-box; transform-origin: 50% 50%; }
.pop { opacity: 0; }
.on .pop { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d, 0s); }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
.on .camI { animation: camI 4s ease-in-out both; animation-delay: var(--d, 0s); }
@keyframes camI { from { transform: translateX(-150px); } to { transform: none; } }
.on .camD { animation: camD 4s ease-in-out both; animation-delay: var(--d, 0s); }
@keyframes camD { from { transform: translateX(150px); } to { transform: none; } }
.on .brinca { animation: brinca .5s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
@keyframes brinca { to { transform: translateY(-4px); } }
.flota { animation: flota 4s ease-in-out infinite; }
@keyframes flota { 0% { opacity: 0; transform: translateY(20px) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-120px) scale(1.1); } }
.onda { animation: onda 1.6s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes onda { from { opacity: .8; transform: scale(.6); } to { opacity: 0; transform: scale(1.8); } }
.on .acerca-i { animation: acI 2.4s ease-in-out forwards; animation-delay: var(--d, 0s); }
@keyframes acI { to { transform: translateX(10px) rotate(4deg); } }
.on .acerca-d { animation: acD 2.4s ease-in-out forwards; animation-delay: var(--d, 0s); }
@keyframes acD { to { transform: translateX(-10px) rotate(-4deg); } }
.paloma { opacity: 0; }
.on .paloma { animation: paloma 6s ease-in-out forwards; animation-delay: var(--d, 0s); }
@keyframes paloma { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--vx, 80px), -200px); } }
.petalo { animation: cae linear infinite; }
@keyframes cae { from { transform: translateY(-30px) rotate(0); } to { transform: translateY(600px) rotate(320deg); } }
.hoja { transform-box: fill-box; transform-origin: 50% 0; }
.on .hoja { animation: hoja 1s ease-in both; animation-delay: var(--d, 0s); }
@keyframes hoja { 0% { transform: none; opacity: 1; } 100% { transform: rotateX(90deg) translateY(-30px); opacity: 0; } }
.reloj-m { transform-box: view-box; transform-origin: 180px 250px; }
.on .reloj-m { animation: gira 1s linear infinite; }
.reloj-h { transform-box: view-box; transform-origin: 180px 250px; }
.on .reloj-h { animation: gira 6s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.parpadea { animation: parp 1s steps(1) infinite; }
@keyframes parp { 50% { opacity: 0; } }
body.pausa *, body.pausa *::before, body.pausa *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .esc { transition: none; } }
</style>
</head>
<body>
<div class="arriba"><a class="volver" href="../">← Menú</a><p class="titulo">Cómo nos conocimos</p></div>
<div class="escenario" id="escenario">
  <svg id="svg" viewBox="0 0 360 560" role="img" aria-label="Animación de cómo nos conocimos"></svg>
  <div class="portada" id="portada">
    <h1>Nuestra historia<span>cómo nos conocimos 💕</span></h1>
    <button class="play" type="button" id="play" aria-label="Ver la animación">▶</button>
    <p>Sube el volumen 🔊 · dura como minuto y medio</p>
  </div>
</div>
<p class="leyenda" id="leyenda" aria-live="polite"></p>
<div class="barra" aria-hidden="true"><span id="progreso"></span></div>
<div class="ctrl" id="ctrl" hidden>
  <button class="btn claro" type="button" id="pausa">⏸ Pausa</button>
</div>
<div class="ctrl" id="fin" hidden>
  <button class="btn" type="button" id="otraVez">↺ Verla otra vez</button>
  <a class="btn claro" href="../" style="text-decoration:none">Volver al menú</a>
</div>
<audio id="cancion" src="../4-meses/mirando-las-estrellas.mp3" preload="auto"></audio>
<script>
const A = (() => {
  const INK = '#22264a';
  const brazo = (d, color, x, y, mano) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="8.4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`
    + `<circle cx="${x}" cy="${y}" r="3.6" fill="${mano}" stroke="${INK}" stroke-width="1.8"/>`;

  // Ella: pelo negro, chaparrita y delgadita, con vestido azul y un moñito
  const PIEL = '#f5cfb3', PELO = '#17141d', VESTIDO = '#7fb2ec';
  function nina(ojos) {
    const cara = ojos === 'felices'
      ? `<path d="M-11 -97 q3 -4 6 0 M5 -97 q3 -4 6 0" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`
      : `<ellipse cx="-8" cy="-97.5" rx="2.2" ry="2.9" fill="${INK}"/><ellipse cx="8" cy="-97.5" rx="2.2" ry="2.9" fill="${INK}"/><circle cx="-7.2" cy="-98.6" r=".8" fill="#fff"/><circle cx="8.8" cy="-98.6" r=".8" fill="#fff"/>`;
    return `<rect x="-8.5" y="-38" width="6.5" height="35" rx="3" fill="${PIEL}" stroke="${INK}" stroke-width="2"/>
      <rect x="2" y="-38" width="6.5" height="35" rx="3" fill="${PIEL}" stroke="${INK}" stroke-width="2"/>
      <ellipse cx="-5.5" cy="-2.6" rx="6.5" ry="3.4" fill="#1d2a57"/><ellipse cx="5.5" cy="-2.6" rx="6.5" ry="3.4" fill="#1d2a57"/>
      <path d="M-24 -104 Q-28 -80 -20 -67 L20 -67 Q28 -80 24 -104 Z" fill="${PELO}"/>
      <path d="M-11 -78 Q-14 -60 -21 -37 Q0 -32 21 -37 Q14 -60 11 -78 Q0 -82 -11 -78 Z" fill="${VESTIDO}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-15 -46 Q0 -42 15 -46" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7"/>
      <circle cx="0" cy="-101" r="21" fill="${PIEL}" stroke="${INK}" stroke-width="2.2"/>
      <path d="M-22.5 -97 Q-24 -125 0 -125 Q24 -125 22.5 -97 Q17 -110 7 -108 Q2 -115 -5 -108 Q-14 -112 -22.5 -97 Z" fill="${PELO}" stroke="${INK}" stroke-width="2"/>
      <g transform="translate(15 -119) rotate(20)"><path d="M0 0 L-7 -5 L-7 5 Z M0 0 L7 -5 L7 5 Z" fill="#3f6fd8" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/><circle r="2" fill="#3f6fd8" stroke="${INK}" stroke-width="1.2"/></g>
      ${cara}
      <ellipse cx="-12.5" cy="-90.5" rx="4" ry="2.4" fill="#f59fb2" opacity=".75"/><ellipse cx="12.5" cy="-90.5" rx="4" ry="2.4" fill="#f59fb2" opacity=".75"/>
      <path d="M-3 -88 q3 3 6 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`;
  }
  const ninaBrazos = pose => pose === 'abrazo'
    ? brazo('M-9 -74 Q-26 -80 -40 -78', PIEL, -40, -78, PIEL) + brazo('M9 -72 Q-4 -60 -24 -60', PIEL, -24, -60, PIEL)
    : brazo('M-10 -74 Q-17 -60 -16 -47', PIEL, -16, -47, PIEL) + brazo('M10 -74 Q17 -60 16 -47', PIEL, 16, -47, PIEL);

  // Su abuelito: canoso, lentes, bigote y suéter
  const PIEL2 = '#eec3a2', SUETER = '#c98f5a', CANAS = '#ecebf3';
  function abuelo() {
    return `<rect x="-12" y="-56" width="9.5" height="53" rx="3" fill="#4b4f6b" stroke="${INK}" stroke-width="2"/>
      <rect x="2.5" y="-56" width="9.5" height="53" rx="3" fill="#4b4f6b" stroke="${INK}" stroke-width="2"/>
      <ellipse cx="-7.5" cy="-2.8" rx="8" ry="3.8" fill="#3a2a22"/><ellipse cx="7.5" cy="-2.8" rx="8" ry="3.8" fill="#3a2a22"/>
      <path d="M-20 -106 Q-25 -80 -22 -52 L22 -52 Q25 -80 20 -106 Q0 -112 -20 -106 Z" fill="${SUETER}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-8 -108 L0 -88 L8 -108 Z" fill="#f4efe6" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M0 -88 V-53" stroke="${INK}" stroke-width="1.6"/>
      <circle cx="3.5" cy="-80" r="1.8" fill="${INK}"/><circle cx="3.5" cy="-70" r="1.8" fill="${INK}"/><circle cx="3.5" cy="-60" r="1.8" fill="${INK}"/>
      <circle cx="-22" cy="-129" r="4.5" fill="${PIEL2}" stroke="${INK}" stroke-width="1.8"/><circle cx="22" cy="-129" r="4.5" fill="${PIEL2}" stroke="${INK}" stroke-width="1.8"/>
      <circle cx="0" cy="-130" r="22" fill="${PIEL2}" stroke="${INK}" stroke-width="2.2"/>
      <ellipse cx="-19" cy="-135" rx="6" ry="7.5" fill="${CANAS}" stroke="${INK}" stroke-width="1.6"/><ellipse cx="19" cy="-135" rx="6" ry="7.5" fill="${CANAS}" stroke="${INK}" stroke-width="1.6"/>
      <path d="M-5 -151 q5 -5 10 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-14 -139 q5 -3 9 0 M5 -139 q5 -3 9 0" fill="none" stroke="#b9b8c8" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-11 -129 q2.5 -3 5 0 M6 -129 q2.5 -3 5 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-8.5" cy="-129.5" r="6.5" fill="rgba(255,255,255,.3)" stroke="${INK}" stroke-width="1.8"/><circle cx="8.5" cy="-129.5" r="6.5" fill="rgba(255,255,255,.3)" stroke="${INK}" stroke-width="1.8"/>
      <path d="M-2 -130 h4" stroke="${INK}" stroke-width="1.8"/>
      <ellipse cx="-14" cy="-120" rx="3.6" ry="2.2" fill="#f0a08c" opacity=".6"/><ellipse cx="14" cy="-120" rx="3.6" ry="2.2" fill="#f0a08c" opacity=".6"/>
      <path d="M-12 -118 Q-6 -124 0 -119.5 Q6 -124 12 -118 Q6 -114 0 -116.5 Q-6 -114 -12 -118 Z" fill="${CANAS}" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M-4 -112.5 q4 3 8 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  const abueloBrazos = pose => pose === 'abrazo'
    ? brazo('M-17 -96 Q4 -58 46 -48', SUETER, 46, -48, PIEL2)
    : brazo('M-19 -101 Q-29 -82 -26 -62', SUETER, -26, -62, PIEL2) + brazo('M19 -101 Q29 -82 26 -62', SUETER, 26, -62, PIEL2);

  // Eduardo: más alto, playera blanca holgada, pantalón negro holgado y lentes
  const PIEL3 = '#eec4a4', NEGRO = '#f7f6f2';
  const manga = (d, x, y) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${PIEL3}" stroke-width="5.6" stroke-linecap="round"/>`
    + `<circle cx="${x}" cy="${y}" r="3.8" fill="${PIEL3}" stroke="${INK}" stroke-width="1.8"/>`;
  function eduardo() {
    return `<path d="M-17 -72 L-18 -5 L-3 -5 L0 -52 L3 -5 L18 -5 L17 -72 Z" fill="#1a1a21" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-9 -40 l1 30 M9 -40 l-1 30" stroke="#33333f" stroke-width="1.4"/>
      <ellipse cx="-10" cy="-3.6" rx="9.5" ry="4.2" fill="#f4f4f6" stroke="${INK}" stroke-width="1.8"/><ellipse cx="10" cy="-3.6" rx="9.5" ry="4.2" fill="#f4f4f6" stroke="${INK}" stroke-width="1.8"/>
      <path d="M-25 -122 Q-31 -96 -28 -64 Q0 -58 28 -64 Q31 -96 25 -122 Q0 -130 -25 -122 Z" fill="${NEGRO}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-20 -100 Q-18 -84 -21 -68 M20 -100 Q18 -84 21 -68 M-8 -90 q4 6 2 14" fill="none" stroke="#dcdad2" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-10 -125 Q0 -115 10 -125" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/><path d="M-8 -123 Q0 -117 8 -123" fill="none" stroke="#dcdad2" stroke-width="1.4"/>
      <circle cx="-22" cy="-146" r="4.5" fill="${PIEL3}" stroke="${INK}" stroke-width="1.8"/><circle cx="22" cy="-146" r="4.5" fill="${PIEL3}" stroke="${INK}" stroke-width="1.8"/>
      <circle cx="0" cy="-146" r="22" fill="${PIEL3}" stroke="${INK}" stroke-width="2.2"/>
      <path d="M-22.8 -143 Q-25 -171 0 -172 Q25 -171 22.8 -143 Q18 -155 8 -154 Q3 -161 -4 -155 Q-14 -159 -22.8 -143 Z" fill="#17141d" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-15.5" y="-145" width="12.5" height="9.5" rx="3" fill="rgba(255,255,255,.3)" stroke="${INK}" stroke-width="2"/><rect x="3" y="-145" width="12.5" height="9.5" rx="3" fill="rgba(255,255,255,.3)" stroke="${INK}" stroke-width="2"/>
      <path d="M-3 -141 h6 M-15.5 -141 h-6 M15.5 -141 h6" stroke="${INK}" stroke-width="1.8"/>
      <path d="M-12 -139.5 q2.8 -3 5.6 0 M6.4 -139.5 q2.8 -3 5.6 0" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/>
      <ellipse cx="-14" cy="-131" rx="3.6" ry="2" fill="#f0a08c" opacity=".55"/><ellipse cx="14" cy="-131" rx="3.6" ry="2" fill="#f0a08c" opacity=".55"/>
      <path d="M-4 -130 q4 3.5 8 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>
      ${manga('M23 -117 Q33 -92 29 -64', 29, -63)}${manga('M-23 -117 Q-33 -86 -28 -56', -28, -55)}
      <path d="M22 -123 Q33 -118 38 -101 L27 -96 Q25 -104 21 -108 Z" fill="${NEGRO}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-22 -123 Q-33 -118 -38 -101 L-27 -96 Q-25 -104 -21 -108 Z" fill="${NEGRO}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  return { nina, ninaBrazos, eduardo, brazo, PIEL };
})();
const altar = { dibujo: { eduardo: A.eduardo } };
const B = (() => {
  const INK = '#22264a', PIEL = '#f5cfb3', PELO = '#17141d';
  const brazo = (d, c, x, y, mano) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="8.4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3.6" fill="${mano}" stroke="${INK}" stroke-width="1.8"/>`;
  function ramo(tipo) {
    const P = [[0, -60], [-7, -55], [7, -55], [-4, -49], [4, -49], [0, -54]];
    const hojas = `<ellipse cx="-11" cy="-51" rx="3" ry="7" fill="#7cc48a" stroke="#3f8a52" stroke-width="1" transform="rotate(-40 -11 -51)"/><ellipse cx="11" cy="-51" rx="3" ry="7" fill="#7cc48a" stroke="#3f8a52" stroke-width="1" transform="rotate(40 11 -51)"/>`;
    const cinta = `<path d="M-3 -44 L-6 -30 M3 -44 L6 -30" stroke="#7fb2ec" stroke-width="2.4" stroke-linecap="round"/><circle cx="0" cy="-44" r="2.4" fill="#7fb2ec" stroke="${INK}" stroke-width=".8"/>`;
    let f = '';
    if (tipo === 'girasoles') P.forEach(([x, y]) => { for (let k = 0; k < 8; k++) f += `<ellipse cx="${x}" cy="${y - 4}" rx="1.6" ry="3" fill="#ffcc33" transform="rotate(${k * 45} ${x} ${y})"/>`; f += `<circle cx="${x}" cy="${y}" r="2.4" fill="#6b3f23"/>`; });
    else if (tipo === 'lavanda') [-6, -2, 2, 6, 0].forEach((x, k) => { f += `<path d="M${x} -46 V${-66 + (k % 2) * 3}" stroke="#5f9e5a" stroke-width="1.2"/>`; for (let j = 0; j < 5; j++) f += `<ellipse cx="${x + (j % 2 ? 1.2 : -1.2)}" cy="${-64 + (k % 2) * 3 + j * 3}" rx="1.6" ry="1.3" fill="#a98ad8"/>`; });
    else if (tipo === 'azules') P.forEach(([x, y]) => { for (let k = 0; k < 6; k++) f += `<circle cx="${x + Math.cos(k) * 2.6}" cy="${y + Math.sin(k) * 2.6}" r="1.9" fill="${k % 2 ? '#9cc4ff' : '#c4dbff'}" stroke="#3f6fd8" stroke-width=".5"/>`; });
    else { const c = { blancas: ['#ffffff', '#c9c7d6'], rojas: ['#e0314b', '#9e1d33'], peonias: ['#ffb0c8', '#e0789a'] }[tipo] || ['#fff', '#ccc']; P.forEach(([x, y]) => { f += `<circle cx="${x}" cy="${y}" r="4.6" fill="${c[0]}" stroke="${c[1]}" stroke-width="1"/><path d="M${x - 2.5} ${y} q2.5 -3 5 0 q-2.5 2 -4 0.5" fill="none" stroke="${c[1]}" stroke-width=".8"/>`; }); }
    return hojas + cinta + f + `<circle cx="-9" cy="-59" r="1.2" fill="#fff"/><circle cx="9" cy="-60" r="1.2" fill="#fff"/>`;
  }
  function vestido(t, c) {

ESC.push(() => {

// ---------- Línea de tiempo (segundos) ----------
const ESCENAS_T = [0, 7, 18, 31, 41, 53, 66, 71, 85];
const DUR = 93;
const LEYENDAS = [
  [0.5, 'Esta es nuestra historia ✨'], [3.8, 'Todo empezó la noche del 20 de abril…'],
  [7.5, '…a las 10:48 pm, jugando en línea. 🎮'], [12.5, 'Un «hola» en un juego. Ninguno de los dos sabía lo que venía.'],
  [18.5, 'Nos hicimos amigos y empezamos a platicar…'], [25, '…todos los días, de todo y de nada. 💬'],
  [31.5, 'Luego vinieron las llamadas. 📞'], [36, 'Y las horas se nos pasaban volando.'],
  [41.5, 'Y las videollamadas… 📱'], [47, '…hasta quedarnos dormidos. 💤'],
  [53.5, 'Fuimos amigos mucho tiempo…'], [57.5, '…hasta el 14 de junio de 2026. 💕'], [62, 'Ese día empezó lo nuestro.'],
  [66.5, 'Años después… en 2030 💕'],
  [71.5, '…dijimos que sí, para toda la vida. 💍'], [78.5, 'Brittany y Lalito. 💞'],
  [85.5, 'Y pensar que todo empezó en un juego…'], [89.5, 'Te amo, princesa. 💕'],
];
const svg = document.getElementById('svg'), cancion = document.getElementById('cancion');
const ley = document.getElementById('leyenda'), prog = document.getElementById('progreso');
let t0 = 0, acumulado = 0, corriendo = false, raf = 0, esc = -1, leyI = -1, pausado = false;
function montar() { svg.innerHTML = ESC.map((f, i) => `<g class="esc" id="e${i}">${f()}</g>`).join(''); }
function mostrar(i) {
  document.querySelectorAll('.esc').forEach((g, k) => {
    if (k === i) { g.classList.remove('on'); void g.getBBox(); g.classList.add('on'); }
    else g.classList.remove('on');
  });
}
function leyenda(t) { ley.textContent = t; ley.classList.remove('cambia'); void ley.offsetWidth; ley.classList.add('cambia'); }
function tiempo() { return acumulado + (corriendo ? (performance.now() - t0) / 1000 : 0); }
function cuadro() {
  const t = tiempo();
  let i = 0; while (i + 1 < ESCENAS_T.length && t >= ESCENAS_T[i + 1]) i++;
  if (i !== esc) { esc = i; mostrar(i); }
  let j = -1; LEYENDAS.forEach(([s], k) => { if (t >= s) j = k; });
  if (j !== leyI && j >= 0) { leyI = j; leyenda(LEYENDAS[j][1]); }
  const cr = document.getElementById('cronometro');
  if (cr && esc === 3) { const seg = Math.floor(Math.min(1, (t - 31) / 8) * 11667); cr.textContent = [Math.floor(seg / 3600), Math.floor(seg / 60) % 60, seg % 60].map(n => String(n).padStart(2, '0')).join(':'); }
  prog.style.width = Math.min(100, t / DUR * 100) + '%';
  if (t >= DUR - 4 && !cancion.paused) cancion.volume = Math.max(0, Math.min(1, (DUR - t) / 4));
  if (t >= DUR) { terminar(); return; }
  raf = requestAnimationFrame(cuadro);
}
function empezar() {
  document.getElementById('portada').hidden = true;
  document.getElementById('fin').hidden = true; document.getElementById('ctrl').hidden = false;
  montar(); esc = -1; leyI = -1; acumulado = 0; t0 = performance.now(); corriendo = true; pausado = false;
  document.body.classList.remove('pausa'); document.getElementById('pausa').textContent = '⏸ Pausa';
  try { cancion.currentTime = 0; cancion.volume = 1; const p = cancion.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  cancelAnimationFrame(raf); raf = requestAnimationFrame(cuadro);
}
function terminar() {
  corriendo = false; cancelAnimationFrame(raf);
  try { cancion.pause(); } catch (e) {}
  document.getElementById('ctrl').hidden = true; document.getElementById('fin').hidden = false;
}
document.getElementById('play').addEventListener('click', empezar);
document.getElementById('otraVez').addEventListener('click', empezar);
document.getElementById('pausa').addEventListener('click', () => {
  if (!pausado) { acumulado = tiempo(); corriendo = false; pausado = true; cancelAnimationFrame(raf); try { cancion.pause(); } catch (e) {} document.body.classList.add('pausa'); document.getElementById('pausa').textContent = '▶ Seguir'; }
  else { t0 = performance.now(); corriendo = true; pausado = false; try { cancion.play(); } catch (e) {} document.body.classList.remove('pausa'); document.getElementById('pausa').textContent = '⏸ Pausa'; raf = requestAnimationFrame(cuadro); }
});
montar(); mostrar(0);
</script>
