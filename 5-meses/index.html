<title>El Baile Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --noche: #111739; --oro: #e9c46a; --oro2: #f6e3a8; --texto: #f4ecdc; --suave: #b9c0e6; --rosa: #f2a7bd; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100svh; background: radial-gradient(ellipse at 50% 0%, #2a3474 0%, #161d4a 45%, var(--noche) 100%); color: var(--texto); font-family: 'Cormorant Garamond', Georgia, serif; display: grid; place-items: center; padding: 24px 16px; overflow-x: hidden; }
  #estrellas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .tarjeta { position: relative; width: min(100%, 380px); text-align: center; padding: 30px 22px 26px; border-radius: 22px; background: rgba(17, 23, 57, .72); border: 1.5px solid rgba(233, 196, 106, .55); box-shadow: 0 0 0 6px rgba(233, 196, 106, .08), 0 20px 60px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); }
  .candado { width: 96px; height: 96px; margin: 0 auto 6px; display: block; filter: drop-shadow(0 0 18px rgba(233, 196, 106, .45)); }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 46px; line-height: 1.05; margin: 4px 0 6px; color: var(--oro2); }
  p { margin: 0 0 18px; font-size: 19px; line-height: 1.35; color: var(--suave); }
  form { display: grid; gap: 12px; }
  input { width: 100%; font: 600 20px 'Cormorant Garamond', Georgia, serif; text-align: center; padding: 13px 14px; border-radius: 14px; border: 1.5px solid rgba(233, 196, 106, .6); background: rgba(255, 255, 255, .06); color: var(--texto); outline: none; letter-spacing: .04em; }
  input:focus { border-color: var(--oro2); box-shadow: 0 0 0 4px rgba(233, 196, 106, .18); }
  input::placeholder { color: rgba(185, 192, 230, .7); letter-spacing: 0; }
  button { font: 700 20px 'Cormorant Garamond', Georgia, serif; padding: 13px 14px; border-radius: 14px; border: 0; cursor: pointer; color: #2a1d05; background: linear-gradient(180deg, var(--oro2), var(--oro)); box-shadow: 0 6px 18px rgba(233, 196, 106, .3); }
  button:disabled { opacity: .7; cursor: default; }
  .cuenta { display: flex; justify-content: center; gap: 8px; margin: 2px 0 18px; }
  .cuenta div { min-width: 64px; padding: 8px 4px 6px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(233, 196, 106, .4); }
  .cuenta b { display: block; font-size: 30px; line-height: 1; color: var(--oro2); font-variant-numeric: tabular-nums; }
  .cuenta span { font-size: 14px; color: var(--suave); }
  .cuenta-titulo { margin: 0 0 8px; font-size: 17px; color: var(--rosa); }
  .error { min-height: 24px; margin: 4px 0 0; font-size: 18px; color: var(--rosa); }
  .tiembla { animation: tiembla .4s; }
  @keyframes tiembla { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .carta { display: inline-block; margin-top: 14px; font-size: 18px; color: var(--oro2); text-decoration: none; border-bottom: 1px dashed rgba(233, 196, 106, .6); }
  .volver { display: block; margin-top: 10px; font-size: 16px; color: var(--suave); text-decoration: none; }
</style>
</head>

  const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const LLAVE = 'baile5-llave';
  async function llaveDe(clave) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bin(SAL), iterations: ITER }, base, 256));
  }
  async function abrir(bits) {
    const k = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(IV) }, k, bin(DATOS)));
    clearInterval(window.__relojPuerta); document.open(); document.write(html); document.close();
  }
  const guardada = (() => { try { return localStorage.getItem(LLAVE); } catch (e) { return null; } })();
  if (guardada) abrir(bin(guardada)).catch(() => { try { localStorage.removeItem(LLAVE); } catch (e) {} });

  const forma = document.getElementById('forma'), boton = document.getElementById('entrar'), err = document.getElementById('error');
  forma.addEventListener('submit', async ev => {
    ev.preventDefault(); err.textContent = ''; boton.disabled = true; boton.textContent = 'Abriendo… ✨';
    try {
      const bits = await llaveDe(document.getElementById('clave').value);
      await abrir(bits);
      try { localStorage.setItem(LLAVE, btoa(String.fromCharCode(...bits))); } catch (e) {}
    } catch (e) {
      boton.disabled = false; boton.textContent = 'Entrar ✨';
      err.textContent = 'Esa no es la llave, princesa 💙 Inténtalo otra vez';
      const t = document.getElementById('tarjeta'); t.classList.remove('tiembla'); void t.offsetWidth; t.classList.add('tiembla');
    }
  });

  const BAILE = new Date(2026, 10, 14, 0, 0, 0);
  function cuenta() {
    const ms = BAILE - new Date();
    if (ms <= 0) { document.getElementById('cuenta').hidden = true; document.getElementById('cuentaTitulo').textContent = '¡Hoy es tu día, princesa! Feliz cumpleaños y felices 5 meses 👑'; return; }
    const s = Math.floor(ms / 1000), d = (id, v) => document.getElementById(id).textContent = v;
    d('cD', Math.floor(s / 86400)); d('cH', Math.floor(s / 3600) % 24); d('cM', Math.floor(s / 60) % 60); d('cS', s % 60);
  }
  cuenta(); window.__relojPuerta = setInterval(cuenta, 1000);

  const cv = document.getElementById('estrellas'), cx = cv.getContext('2d'); let E = [];
  function tam() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; E = Array.from({ length: 90 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: (Math.random() * 1.3 + .4) * devicePixelRatio, f: Math.random() * 6 })); }
  function pinta(t) { cx.clearRect(0, 0, cv.width, cv.height); for (const s of E) { cx.globalAlpha = .35 + .65 * Math.abs(Math.sin(t / 1400 + s.f)); cx.fillStyle = '#fff6dc'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill(); } requestAnimationFrame(pinta); }
  addEventListener('resize', tam); tam(); requestAnimationFrame(pinta);
})();
